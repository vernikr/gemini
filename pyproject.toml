[project]
name = "gemini-mcp-gateway"   # PyPI dist name (gemini-mcp taken); CLI bin stays gemini-mcp
version = "0.17.3"
description = "MCP gateway for massive-payload Gemini analysis on the AI Studio free tier: chunking with overlap, consolidation, thinking_level control, deep progress, rotating disk logs"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "vernikr" }]
dependencies = [
    "gemini-router>=0.1.12,<0.2",
    "mcp[cli]>=1.9",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",   # .env autoload for bare launches (ssh stdio); systemd keeps EnvironmentFile
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[project.scripts]
gemini-mcp = "gemini_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:mcp.*",
    "ignore:The logging capability is deprecated.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
# dev-only: consumers of the PyPI wheel get gemini-router from PyPI (metadata is clean)
gemini-router = { git = "https://github.com/vernikr/gemini-router.git", tag = "v0.1.12" }
