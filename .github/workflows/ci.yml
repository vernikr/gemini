name: ci
# Tags are the release workflow's business: on a tag `release.test` runs the same checks
# over the same commit, so triggering here too spent a duplicate job per release. Feature
# branches are covered by the pull_request trigger.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check src tests        # no deps needed for lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # Public-registry deps only: gemini-router is on PyPI (>=0.1.1), so CI needs no
      # private-git auth (GH_PAT_READ is obsolete). UV_NO_SOURCES=1 skips the dev-only
      # tool.uv.sources git pin — CI validates exactly what consumers install.
      - name: Install deps
        run: |
          uv venv .venv-ci
          UV_NO_SOURCES=1 uv pip install --python .venv-ci/bin/python -e ".[dev]"
      - run: .venv-ci/bin/pytest -q
