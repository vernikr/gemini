name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check src tests        # no deps needed for lint
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # private git dependency (gemini-router) needs a read PAT in repo secrets:
      - name: Configure git auth for private deps
        run: |
          git config --global url."https://x-access-token:${{ secrets.GH_PAT_READ }}@github.com/".insteadOf "https://github.com/"
      - run: uv sync --extra dev
      - run: uv run pytest -q
