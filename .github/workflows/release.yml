name: release
# Publish the Python package and npm bootstrap from matching SemVer tags, then verify
# that consumers can install both artifacts from their public registries.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
      # Trusted publishing must be configured for this project, repository and
      # workflow environment in the PyPI project settings.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install from PUBLIC registries only (exactly what consumers get)
        run: |
          uv venv .venv-ci
          UV_NO_SOURCES=1 uv pip install --refresh-package gemini-router --python .venv-ci/bin/python -e ".[dev]"
      - run: python3 scripts/check_secrets.py
      - run: .venv-ci/bin/ruff check .
      - run: .venv-ci/bin/pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
        working-directory: packaging/npm
  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi                     # matches the PyPI trusted-publisher config
    permissions:
      contents: read                     # job-level permissions REPLACE workflow-level:
      id-token: write                    # OIDC handshake with PyPI needs both
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lockstep guard — pyproject version must equal the tag
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" pyproject.toml
      - run: rm -rf dist && uv build      # dist hygiene: never ship stale artifacts
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true             # re-tag/re-run safe: files already on PyPI pass
  npm:
    needs: pypi                           # shim pins ==<version>: PyPI artifact first
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                     # npm --provenance attestation (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Lockstep guard — package.json version must equal the tag
        working-directory: packaging/npm
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
      # npm answers a scoped PUT it refuses with 404, which reads like "no such
      # package". Name the real cause before the publish, or every failure here costs
      # another round trip of guessing.
      - name: Check npm access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::NPM_TOKEN secret is empty"; exit 1; }
          if ! npm whoami; then
            echo "::error::npm rejected NPM_TOKEN (401). The token is revoked or expired — regenerate an Automation token on npmjs.com and update the secret."
            exit 1
          fi
          npm access list packages || echo "::warning::the token lists no packages — it lacks rights on this scope"
      - name: Publish shim
        working-directory: packaging/npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  smoke:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consumer E2E from the public registries
        run: |
          V="${GITHUB_REF_NAME#v}"
          # Retry actual consumer installs to allow package-index propagation.
          try() {           # $1 = registry name; rest = consumer command
            local name="$1"; shift
            for i in $(seq 1 40); do
              if "$@"; then echo "$name: served $V on attempt $i"; return 0; fi
              sleep 15
            done
            echo "::error::$name did not serve $V within 10 minutes"; return 1
          }
          try PyPI uvx --refresh --from "vernikr-gemini==$V" gemini --version
          try npm  npx -y "@vernikr/gemini@$V" --version

  deploy:
    needs: pypi                             # deploy only what is already on PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - name: Deploy exact version to production
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/ci_deploy_key
          chmod 600 ~/.ssh/ci_deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          version="${GITHUB_REF_NAME#v}"
          ssh -i ~/.ssh/ci_deploy_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy gemini $version"
