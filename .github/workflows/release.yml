name: release
# Dual-publish on tag v*: test (public-registry deps) → PyPI (trusted publishing,
# OIDC — no API token in secrets) → npm shim (provenance) → consumer smoke against
# the live registries. One-time store setup: docs/09-ci.md. Manual fallback (until
# stores are configured): docs/05-packaging.md "Publishing".
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install from PUBLIC registries only (exactly what consumers get)
        run: |
          uv venv .venv-ci
          UV_NO_SOURCES=1 uv pip install --python .venv-ci/bin/python -e ".[dev]"
      - run: .venv-ci/bin/ruff check .
      - run: .venv-ci/bin/pytest -q
  pypi:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi                     # matches the PyPI trusted-publisher config
    permissions:
      contents: read                     # job-level permissions REPLACE workflow-level:
      id-token: write                    # OIDC handshake with PyPI needs both
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Lockstep guard — pyproject version must equal the tag
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" pyproject.toml
      - run: rm -rf dist && uv build      # dist hygiene: never ship stale artifacts
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true             # re-tag/re-run safe: files already on PyPI pass
  npm:
    needs: pypi                           # shim pins ==<version>: PyPI artifact first
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                     # npm --provenance attestation (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Lockstep guard — package.json version must equal the tag
        working-directory: packaging/npm
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#v}"
      # npm answers a scoped PUT it refuses with 404, which reads like "no such
      # package". Name the real cause before the publish, or every failure here costs
      # another round trip of guessing.
      - name: Check npm access
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::NPM_TOKEN secret is empty"; exit 1; }
          if ! npm whoami; then
            echo "::error::npm rejected NPM_TOKEN (401). The token is revoked or expired — regenerate an Automation token on npmjs.com and update the secret."
            exit 1
          fi
          npm access list packages || echo "::warning::the token lists no packages — it lacks rights on this scope"
      - name: Publish shim
        working-directory: packaging/npm
        # no --provenance: sigstore attestation requires a PUBLIC source repo (E422);
        # re-enable if/when the repo goes public (then id-token:write is already set)
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  smoke:
    needs: npm
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Consumer E2E from the public registries (retry while propagating)
        run: |
          V="${GITHUB_REF_NAME#v}"; ok=0
          for _ in $(seq 1 12); do
            if uvx --refresh --from "gemini-mcp-gateway==$V" gemini-mcp --version; then ok=1; break; fi
            sleep 30
          done
          test "$ok" = 1 || { echo "PyPI smoke failed for $V"; exit 1; }
          ok=0
          # npm propagation observed up to ~7 min (0.8.2: live 24s after the last of
          # 8×30s retries) — 16×30s = 8 min window
          for _ in $(seq 1 16); do
            if npx -y "@vernikr/gemini-mcp@$V" --version; then ok=1; break; fi
            sleep 30
          done
          test "$ok" = 1 || { echo "npm smoke failed for $V"; exit 1; }

  deploy:
    needs: pypi                             # deploy only what is already on PyPI
    uses: vernikr/browser-agent/.github/workflows/deploy-ssh.yml@main
    with:
      app: gemini-mcp                       # → /etc/deploy-tools.d/gemini-mcp.conf on the VPS
      tag: ${{ github.ref_name }}
    secrets: inherit                        # DEPLOY_SSH_KEY / DEPLOY_HOST / DEPLOY_USER
